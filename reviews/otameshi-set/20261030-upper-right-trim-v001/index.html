<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お試しセット｜AR確認</title><link rel="stylesheet" href="style.css"></head><body><main><h1>お試しセット</h1><p>右上を整えた商品と、墨色の円形台です。</p><model-viewer id="viewer" src="model.glb" camera-controls loading="lazy" reveal="manual" interaction-prompt="none" shadow-intensity="0" exposure="1" alt="お試しセットの3Dモデル"></model-viewer><button id="preview">3Dモデルを見る</button><p id="viewer-status"></p><a class="ar" rel="ar" href="model.usdz"><img src="ar-icon.svg" width="48" height="48" alt="AR"><span>iPhoneでARを見る</span></a><p>iPhoneのSafariで開き、表示先で「AR」を選んでテーブルや床に置いてください。</p><p>円形台は直径44cm・厚さ1cm。食品は幅41cm基準の仮縮尺です。ピンチ操作で拡大縮小した場合は、下のメモに記入してください。</p><section><h2>実機で確認した結果</h2><p>3D表示だけの場合は、AR配置を「未確認」のままにしてください。</p><label>端末<input id="device" value="iPhone 13 Pro"></label><label>iOSのバージョン<input id="os" placeholder="未確認の場合は空欄"></label><label>実際のテーブル・床にAR配置できた<select id="ar_placed"><option value="untested">未確認</option><option value="pass">問題なし</option><option value="revise">修正・問題あり</option></select></label><label>形・切り口<select id="geometry"><option value="untested">未確認</option><option value="pass">問題なし</option><option value="revise">修正・問題あり</option></select></label><label>色・ツヤ<select id="color_material"><option value="untested">未確認</option><option value="pass">問題なし</option><option value="revise">修正・問題あり</option></select></label><label>台の接地・浮き・食い込み<select id="contact"><option value="untested">未確認</option><option value="pass">問題なし</option><option value="revise">修正・問題あり</option></select></label><label>表示サイズの見え方（仮縮尺）<select id="scale_appearance"><option value="untested">未確認</option><option value="pass">問題なし</option><option value="revise">修正・問題あり</option></select></label><label>読み込み・回転・操作<select id="performance"><option value="untested">未確認</option><option value="pass">問題なし</option><option value="revise">修正・問題あり</option></select></label><label>実測値とのサイズ照合<select id="dimensions"><option value="untested">未確認・仮縮尺のまま</option><option value="pass">実測値と照合して一致</option><option value="revise">実測値と差がある</option></select></label><label>実測値・方法、または気になる箇所<textarea id="note" rows="4"></textarea></label><button id="save">確認結果を保存</button><button id="share" hidden>結果を共有</button><p id="save-status" role="status"></p><p>保存したJSONをこのチャットへ添付してください。未確認の項目を残した途中保存もできます。</p></section><p class="version">確認版：20261030-upper-right-trim-v001</p></main><script src="vendor/model-viewer-classic.js"></script><script src="binding.js"></script><script src="app.js"></script></body></html>
