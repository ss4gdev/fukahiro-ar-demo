<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>深廣｜とらふぐ鍋セットを机に置く</title>
<link rel="stylesheet" href="../20261121-brush-alva-blippar-v007/style.css">
<style>
#target{background:transparent}#target.search{border:2px dashed white}#adjust button{touch-action:manipulation}#bottom #status{white-space:normal}#tools{justify-content:flex-end}
#optics-check{position:absolute;inset:0;z-index:11000;pointer-events:none;color:white}
#optics-check:before,#optics-check:after{content:"";position:absolute;top:var(--guide-y,50%);transform:translate(-50%,-50%);height:40px;width:2px;background:white;box-shadow:0 0 0 1px black}
#optics-check:before{left:var(--guide-left,20%)}#optics-check:after{left:var(--guide-right,80%)}
#optics-panel{position:absolute;bottom:0;left:0;right:0;background:#14241df2;max-height:43%;overflow:auto;padding:10px 15px max(14px,env(safe-area-inset-bottom));pointer-events:auto}
#optics-panel p{font-size:14px;margin:2px 0 6px}
#optics-panel label{display:inline-block;margin-right:14px}#optics-panel input{display:block;width:6em;color:#172b22}
</style></head>
<body data-version="v013"><main id="menu"><p class="brand">深廣 · 実寸検証 v013</p><h1 id="subject">とらふぐ鍋セットを机に置く</h1>
<p>置きたい場所を中央に映し、iPhoneを少し左右に動かしてください。「ここに置く」が使えるようになったら、1回タップします。</p>
<button id="start" class="primary" disabled>ARを開始</button> <a href="../20261121-brush-quick-placement-v001/direct.html">3Dで見る</a><p id="notice" role="status"></p>
<small>皿の直径は25cmです。表示精度を確認中です。動きとカメラの利用を許可してください。</small>
<p><a href="../20261121-brush-alva-metric-v011/review.html">測定記録を開く</a></p></main><div id="ar" hidden><div id="viewport"><video id="camera-feed" muted playsinline autoplay></video><canvas id="paired-feed" hidden aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none"></canvas><canvas id="application-canvas"></canvas></div>
<div id="tools" style="justify-content:space-between"><b hidden id="size-state" role="status"></b><button id="optics-open" hidden style="margin-left:auto">画角を測る</button><button id="end">終了</button></div><button id="target" class="search" aria-label="この位置に鍋を置く"></button>
<div id="bottom"><span id="status" role="status"></span><button id="place" class="primary">ここに置く</button>
<div id="recovery"><button id="retry">再試行</button> <a style="pointer-events:auto;background:white;border-radius:8px;padding:12px" href="../20261121-brush-quick-placement-v001/direct.html">3Dで見る</a></div>
<div id="adjust" hidden><button id="turn-left" aria-label="鍋を左に回す">↶</button><button id="replace">置き直す</button><button id="turn-right" aria-label="鍋を右に回す">↷</button></div></div>
<div id="optics-check" hidden aria-label="定規による画角の測定"><div id="optics-panel">
<p id="optics-help" role="status">机に定規を横向きに置き、背面レンズを真下に向け、iPhoneを机と平行にします。定規の目盛りが左右の白線に重なる高さで映像を固定してください。</p>
<button id="freeze">映像を固定</button>
<form id="optics-form" hidden><label>レンズから定規の面までの高さ（cm）<input id="lens-height" type="number" min="0.1" step="any" inputmode="decimal" required></label>
<label>白線2本の間の目盛り幅（cm）<input id="ruler-span" type="number" min="0.1" step="any" inputmode="decimal" required></label>
<button type="submit">測定を保存して終了</button></form>
<button id="optics-close">測らずに終了</button></div></div></div>
<script type="module" src="./app.mjs"></script></body></html>
