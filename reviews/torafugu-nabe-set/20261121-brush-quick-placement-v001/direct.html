<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>深廣｜Brushの鍋セットのツヤを見る</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#233e33;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}
main{max-width:820px;margin:auto;padding:20px 16px 36px}a{color:#23543f}h1{font:600 clamp(24px,5vw,34px)/1.45 "Yu Mincho",serif;margin:10px 0}
p{margin:8px 0}#frame{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:832/640}
canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;top:12px;left:12px;margin:0;padding:6px 12px;border-radius:6px;background:#fffdf4;color:#244837;font-size:14px;pointer-events:none}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,.button{font:inherit;color:#244837;background:#fffdf7;border:1px solid #849b8c;border-radius:7px;padding:8px 13px;min-height:44px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.small{font-size:14px;color:#4b5e51}h2{font-size:19px;margin:22px 0 5px}details{margin:14px 0}
</style>
</head>
<body>
<main>
<a href="./">← Brushを机に置く</a>
<h1>Brushの鍋セットのツヤを見る</h1>
<p>指で回転、2本指で拡大。見る角度に合わせてBrushを直接描画します。</p>
<div id="frame"><canvas id="view" aria-label="鍋セット全体の3D表示"></canvas><p id="status" role="status">学習データを読み込み中（8.81 MB）</p></div>
<div class="controls"><button id="left" disabled>左へ</button><button id="right" disabled>右へ</button><button id="higher" disabled>上から</button><button id="reset" disabled>最初の向き</button><button id="zoom-in" disabled>拡大</button><button id="zoom-out" disabled>縮小</button></div>
<p class="small">手動で皿の外側を整え、色を調整した鍋セットです。</p>
<h2>机に置いて見る</h2><p><a href="./">アプリ不要のBrush WebARで開く</a></p>
</main>
<script type="module" src="direct.mjs"></script>
</body>
</html>
