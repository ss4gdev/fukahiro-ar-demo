<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>深廣｜とらふぐ鍋セットを机に置く</title>
<link rel="stylesheet" href="../20261121-brush-alva-blippar-v007/style.css">
<style>#target{background:transparent}#target.search{border:2px dashed white}#adjust button{touch-action:manipulation}#bottom #status{white-space:normal}#tools{justify-content:flex-end}</style></head>
<body data-version="v010"><main id="menu"><p class="brand">深廣</p><h1>とらふぐ鍋セットを机に置く</h1>
<p>机を中央に映して「ここに置く」を1回押し、iPhoneを少し左右に動かしてください。この旧版は推定が終わる前にも仮置きできます。比較時は上部の準備完了表示を待ってください。</p>
<button id="start" class="primary" disabled>カメラを開く</button><p id="notice" role="status"></p>
<small>皿の直径は25cmです。表示精度を確認中です。動きとカメラの利用を許可してください。</small>
<p><a href="./review.html">検証の条件・測定記録</a></p></main><div id="ar" hidden><div id="viewport"><video id="camera-feed" muted playsinline autoplay></video><canvas id="paired-feed" hidden aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none"></canvas><canvas id="application-canvas"></canvas></div>
<div id="tools" style="justify-content:space-between"><b hidden id="size-state" role="status"></b><button id="end" style="margin-left:auto">終了</button></div><button id="target" class="search" aria-label="この位置に鍋を置く"></button>
<div id="bottom"><span id="status" role="status"></span><button id="place" class="primary">ここに置く</button>
<div id="adjust" hidden><button id="turn-left" aria-label="鍋を左に回す">↶</button><button id="replace">置き直す</button><button id="turn-right" aria-label="鍋を右に回す">↷</button></div></div></div>
<script type="module" src="./baseline.mjs"></script></body></html>
