<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>深廣｜とらふぐ鍋セットの色比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f2;color:#203b35;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}main{max-width:720px;margin:30px auto;padding:0 18px 40px}h1{font:600 clamp(25px,5.6vw,37px)/1.5 "Yu Mincho",serif;margin:0}h2{font-size:19px;margin:24px 0 8px}p,figure{margin:5px 0}header p,small,figcaption{color:#53655c}.arlist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.arlist article{min-width:0;border-top:1px solid #bfcbc2;padding-top:8px}.arlist h3{margin:0;font-size:17px}.arlink,.arlink img{display:block;width:100%;max-width:260px}.arlink{margin:8px 0}.save{font-size:13px;color:#285b50;display:inline-block;padding:4px 0}.tool{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}button{border:1px solid #acb9af;color:#254c3f;background:#fffef9;border-radius:7px;padding:7px 11px;min-height:40px;font:inherit;font-size:14px;cursor:pointer}button[aria-pressed=true]{background:#285648;color:white}.panel{background:#0b0d0b;border-radius:10px;overflow:hidden}.panel img{width:100%;height:auto;display:block}figcaption{font-size:13px}a:focus-visible,button:focus-visible{outline:3px solid #a87130;outline-offset:2px}@media(max-width:420px){main{margin:16px auto}.tool{gap:4px}.tool button{padding:6px 8px}}
</style></head><body><main><header><small>深廣</small><h1>とらふぐ鍋セット</h1><p>ふぐの身と皮の色を比較します。両版の明るさとツヤの設定は共通です。</p></header>
<section><h2>iPhoneで机に置く</h2><div class="arlist">
<article><h3>現行版</h3><small>38.85 MB</small><a class="arlink" id="ar-current" rel="ar" href="../20261116-high-plate-ar-v001/nabe-all-angle-photo-v004.usdz#allowsContentScaling=0"><img src="quicklook.svg" alt="現行版をQuick Lookで開く" width="250" height="56"></a><a class="save" href="../20261116-high-plate-ar-v001/nabe-all-angle-photo-v004.usdz" download>現行版をファイルに保存</a></article>
<article><h3>色調整版</h3><small id="size">39.22 MB</small><a class="arlink" id="ar-new" rel="ar" href="nabe-fugu-brush-color-v001.usdz#allowsContentScaling=0"><img src="quicklook.svg" alt="色調整版をQuick Lookで開く" width="250" height="56"></a><a class="save" href="nabe-fugu-brush-color-v001.usdz" download>色調整版をファイルに保存</a></article></div>
<small>同じ机で皿の手前をそろえて見比べてください。Safariから直接開けない場合は、保存したUSDZを「ファイル」でタップできます。</small></section>
<section><h2>同じ向きで色を比べる</h2><div class="tool" role="group" aria-label="表示する版"><button data-mode="brush">Brush 37.39 MB</button><button data-mode="current">現行版</button><button data-mode="new" aria-pressed="true">色調整版</button></div>
<figure><div class="panel"><img id="shot" alt="B1の切り身" src="new-e25-a195-b1.webp" width="450" height="340"></div><figcaption id="caption" aria-live="polite">色調整版・B1の切り身・基準の向き</figcaption></figure>
<div class="tool" role="group" aria-label="向き"><button data-angle="180">左15°</button><button data-angle="195" aria-pressed="true">基準の向き</button><button data-angle="210">右15°</button></div>
<div class="tool" role="group" aria-label="表示範囲"><button data-framing="b1" aria-pressed="true">B1の切り身</button><button data-framing="full">鍋全体</button></div>
<small>Brushは37.39 MB版の描画、現行版と色調整版はUSDZをPCで同じ角度から描画した画像です。</small></section>
</main><script>
const s={mode:'new',angle:'195',framing:'b1'};
const names={brush:'Brush 37.39 MB',current:'現行版',new:'色調整版',b1:'B1の切り身',full:'鍋全体','180':'左15°','195':'基準の向き','210':'右15°'};
const image=document.querySelector('#shot'),caption=document.querySelector('#caption');
function render(){document.querySelectorAll('button').forEach(b=>{const [k,v]=Object.entries(b.dataset)[0];b.setAttribute('aria-pressed',String(s[k]===v))});image.src=s.mode+'-e25-a'+s.angle+'-'+s.framing+'.webp';image.alt=caption.textContent=[names[s.mode],names[s.framing],names[s.angle]].join('・');}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{Object.assign(s,b.dataset);render()});render();
</script></body></html>
