<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>とらふぐ鍋セット｜全体の明るさと色</title><link rel="stylesheet" href="review.css"><script type="module" src="viewer.js"></script></head><body><main>
<header><p>深廣　／　High Detail</p><h1>とらふぐ鍋セット <small>全体の明るさと色</small></h1></header>
<div class="layout"><section class="workspace" aria-label="同じ視点で比較">
<div class="viewbar"><label>高さ <select id="elev"><option>65°</option><option>35°</option></select></label><div><button id="prev" aria-label="左に回す">←</button><output id="angle">0°</output><button id="next" aria-label="右に回す">→</button></div><button id="zoom" aria-pressed="false">2倍拡大</button></div>
<div class="frames" id="frames" aria-busy="true">
<figure><figcaption>野菜の調整を反映</figcaption><div class="stage"><canvas id="before" width="1152" height="1008" aria-label="野菜の調整を反映した鍋セット"></canvas></div></figure>
<figure><figcaption id="afterTitle">全体補正後</figcaption><div class="stage" id="pickStage"><canvas id="after" width="1152" height="1008" aria-label="全体の明るさと色を調整した鍋セット"></canvas></div></figure></div>
<p id="status" role="status">読み込み中…</p><p class="small">左右の矢印で全周を確認できます。2倍表示で画像をクリックすると、両方が同じ位置に寄ります。</p>
</section><aside aria-label="全体と野菜の調整">
<h2>料理全体の補正</h2>
<label class="slider" for="ev">明るさ <output id="evVal">+0.65 段</output></label><input id="ev" type="range" min="-1" max="1.5" step="0.05" value="0.65">
<label class="slider" for="sat">鮮やかさ <output id="satVal">106%</output></label><input id="sat" type="range" min="60" max="150" value="106">
<label class="slider" for="protect">明るい部分の階調を保つ <output id="protectVal">100%</output></label><input id="protect" type="range" min="0" max="100" value="100">
<p class="small">明るさを上げたとき、階調を保つほど白い身・豆腐・えのきの明暗差が残ります。</p>
<label class="toggle"><input type="checkbox" id="plate"> 器も一緒に補正</label>
<div class="actions"><button id="preset">開始値に戻す</button><button id="neutral">全体補正をゼロに</button></div>
<details><summary>野菜の設定とえのきの位置</summary>
<label class="slider green" for="green">水菜の緑 <output id="greenVal"></output></label><input id="green" type="range" min="0" max="100" value="35">
<label class="slider orange" for="orange">にんじんの橙 <output id="orangeVal"></output></label><input id="orange" type="range" min="0" max="100" value="30">
<label class="slider" for="white">えのきの白さ <output id="whiteVal"></output></label><input id="white" type="range" min="0" max="100" value="45">
<div class="enoki"><div class="row"><button id="pick" aria-pressed="false">えのきの位置を選ぶ</button><label>範囲 <select id="radius"><option value="8">小</option><option value="16" selected>中</option><option value="26">大</option></select></label></div>
<p class="small">右の画像でえのきの束をクリックしてください。離れた束には点を追加できます。</p>
<div class="row"><span id="points">選択 0 か所</span><button id="undo" disabled>1点戻す</button></div></div>
<label class="toggle"><input type="checkbox" id="overlay"> 適用範囲を表示</label>
<p class="small" id="legend" hidden>緑＝水菜、橙＝にんじん、紫＝えのき。緑と橙は色から推定した候補です。</p>
<div class="actions"><button id="reset">共有した野菜設定に戻す</button></div></details>
<div class="actions"><button id="share">設定リンクをコピー</button></div><p class="small" id="saved" role="status"></p><input id="shareText" type="url" aria-label="設定リンク" readonly hidden></aside></div>
<footer><span>全24視点・High Detail全体のプレビュー</span><a href="../20261114-vegetable-color-controls-v001/">前回の野菜調整画面</a></footer>
</main></body></html>
