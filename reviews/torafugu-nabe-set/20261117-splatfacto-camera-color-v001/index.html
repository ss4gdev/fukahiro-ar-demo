<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>深廣｜とらふぐ鍋セット・Splatfacto</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#233e33;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}main{max-width:720px;margin:auto;padding:28px 18px 46px}header small{color:#516859}h1{font:600 clamp(26px,5vw,37px)/1.45 "Yu Mincho",serif;margin:0}h2{font-size:19px;margin:26px 0 6px}p{margin:5px 0}figure{margin:9px 0}.photo{display:block;width:100%;height:auto;aspect-ratio:832/640;background:#080908;border-radius:10px;touch-action:pan-y}figcaption{font-size:14px;color:#425c4d;margin:5px 0}a{color:#23543f}.ar{display:inline-block;width:235px;margin:8px 0 0}.ar img{display:block;width:100%;height:auto}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0}.angles{display:grid;align-items:center;grid-template-columns:48px minmax(50px,1fr) 48px;gap:12px}input{width:100%;accent-color:#245542}button{background:#fffdf7;border:1px solid #849b8c;border-radius:7px;color:#244837;padding:8px 12px;font:inherit;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#214a38;color:white;border-color:#214a38}.downloads{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}.downloads a{padding:5px 0}.note{font-size:14px;color:#4b5e51}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #a56b18;outline-offset:3px}
</style></head><body><main><header><small>深廣</small><h1>とらふぐ鍋セット</h1><p>撮影時の写真からSplatfactoで復元しました。明るさ・彩度の追加補正はありません。</p></header>
<section aria-labelledby="ar"><h2 id="ar">iPhoneで鍋セットを机に置く</h2>
<a class="ar" rel="ar" href="nabe-splatfacto.usdz#allowsContentScaling=0"><img src="quicklook.svg" alt="鍋セットをQuick Lookで開く" width="250" height="56"></a>
<p class="note">Safariで開き、机に向けてください。AR版は学習した色を立体の表面に写しているため、切り身のツヤの位置は表面に固定されます。</p>
<div class="downloads"><a href="nabe-splatfacto.usdz" download>USDZを保存</a><a href="nabe-splatfacto.glb" download>GLBを保存</a></div></section>
<section aria-labelledby="compare"><h2 id="compare">同じ角度で見比べる</h2>
<div class="controls" role="group" aria-label="モデル"><button data-model="learned" aria-pressed="true">Splatfacto学習結果</button><button data-model="ar" aria-pressed="false">AR用の立体</button></div>
<figure><img class="photo" id="dish" src="learned-e25-a195.webp" alt="学習結果を斜めから見た鍋セット" width="832" height="640" draggable="false"><figcaption id="caption">学習結果・斜め25°・向き195°</figcaption></figure>
<div class="angles"><button aria-label="左へ15度" id="left">←</button><input aria-label="向き" id="angle" type="range" min="0" max="23" value="13"><button aria-label="右へ15度" id="right">→</button></div>
<div class="controls" role="group" aria-label="高さ"><button data-height="25" aria-pressed="true">斜め25°</button><button data-height="50" aria-pressed="false">上から50°</button></div>
<p class="note">学習結果はSplatfactoで描画した画像です。AR用の立体は、書き出したGLBを同じ向きから描画しています。</p></section>
</main><script>
const q=s=>document.querySelector(s), pic=q('#dish'), range=q('#angle');
let model='learned',height=25,i=13,startX=null;
function draw(){const angle=i*15, label=model==='learned'?'学習結果':'AR用の立体';pic.src=model+'-e'+height+'-a'+String(angle).padStart(3,'0')+'.webp';q('#caption').textContent=pic.alt=label+'・高さ'+height+'°・向き'+angle+'°';range.value=i;document.querySelectorAll('[data-model]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.model===model)));document.querySelectorAll('[data-height]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.height===height)))}
function step(d){i=(i+d+24)%24;draw()}
range.oninput=()=>{i=+range.value;draw()};q('#left').onclick=()=>step(-1);q('#right').onclick=()=>step(1);
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{model=b.dataset.model;draw()});document.querySelectorAll('[data-height]').forEach(b=>b.onclick=()=>{height=+b.dataset.height;draw()});
pic.onpointerdown=e=>{startX=e.clientX;pic.setPointerCapture(e.pointerId)};pic.onpointermove=e=>{if(startX!==null && Math.abs(e.clientX-startX)>22){step(e.clientX<startX?1:-1);startX=e.clientX}};pic.onpointerup=pic.onpointercancel=()=>{startX=null};
</script></body></html>
