<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#183e42">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';img-src 'self';style-src 'unsafe-inline';base-uri 'none';form-action 'none'">
<title>深廣｜トラフグてっさ 湯引き</title>
<style>
*{box-sizing:border-box}
html{color-scheme:light;min-height:100%;background:#f5f3ee}
body{margin:0;background:#f5f3ee;color:#173b3e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;line-height:1.8}
main{width:min(100% - 40px,560px);margin:54px auto 40px;text-align:center}
.brand{font-size:16px;letter-spacing:.35em;margin:0 0 8px}
h1{font-size:clamp(26px,6.5vw,34px);line-height:1.45;margin:0 0 24px;font-weight:650}
.ar{display:block;margin:auto;max-width:360px;border-radius:14px;overflow:hidden;box-shadow:0 6px 16px #173b3e19}
.ar img{display:block;width:100%;height:auto}
.ar:focus-visible{outline:3px solid #b88b42;outline-offset:5px}
@media(max-width:360px){main{width:calc(100% - 28px);margin-top:36px}}
</style>
</head>
<body>
<main>
<p class="brand">深廣</p>
<h1>トラフグてっさ 湯引き</h1>
<a class="ar" rel="ar" href="model.usdz"><img src="ar-launch.svg" width="360" height="76" alt="iPhoneでARを見る"></a>
</main>
</body>
</html>
